<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5 Years Countdown</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111827;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
}
h1{margin-bottom:20px;}
#timer{
    font-size:2rem;
    font-weight:bold;
    line-height:1.8;
}
</style>
</head>
<body>

<div>
    <h1>5 Years Countdown</h1>
    <div id="timer"></div>
</div>
<div class="footer">
<p><b>I'm waiting for you.</b></p>
<p>You can find <code>sultanarabi161</code> on almost any social media platform.</p>
<p><b>Ping me anytime.</b><br>I usually reply faster than your Wi‑Fi.</p>
</div>
<script>
const target = new Date(2031, 6, 25, 0, 0, 0); // 25 July 2031

function updateCountdown(){

    const now = new Date();

    if(now >= target){
        document.getElementById("timer").innerHTML="Time is over.";
        return;
    }

    let current = new Date(now);

    let years = 0, months = 0;

    while(true){
        let next = new Date(current);
        next.setFullYear(next.getFullYear()+1);
        if(next <= target){
            years++;
            current = next;
        }else break;
    }

    while(true){
        let next = new Date(current);
        next.setMonth(next.getMonth()+1);
        if(next <= target){
            months++;
            current = next;
        }else break;
    }

    let diff = target - current;

    let days = Math.floor(diff / (1000*60*60*24));
    diff %= 1000*60*60*24;

    let hours = Math.floor(diff / (1000*60*60));
    diff %= 1000*60*60;

    let minutes = Math.floor(diff / (1000*60));
    diff %= 1000*60;

    let seconds = Math.floor(diff / 1000);

    document.getElementById("timer").innerHTML =
        `${years} Year${years!==1?'s':''} `
      + `${months} Month${months!==1?'s':''} `
      + `${days} Day${days!==1?'s':''}<br>`
      + `${hours} Hour${hours!==1?'s':''} `
      + `${minutes} Minute${minutes!==1?'s':''} `
      + `${seconds} Second${seconds!==1?'s':''}`;
}

updateCountdown();
setInterval(updateCountdown,1000);
</script>

</body>
</html>
